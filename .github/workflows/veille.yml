name: Veille DPE

on:
  schedule:
    - cron: "0 6 * * *"   # 7h heure de Paris en hiver (8h en été)
  workflow_dispatch: {}    # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les nouveaux DPE et envoyer le mail
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python veille_dpe.py
      - name: Sauvegarder l'historique et la page web
        run: |
          git config user.name "veille-dpe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Veille DPE $(date +%F)"
          git push
